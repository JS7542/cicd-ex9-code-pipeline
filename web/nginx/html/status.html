<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Status</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header><div class="wrap nav"><div class="brand">Docker Web Lab</div><nav><a href="/">홈</a><a href="/kubernetes">Kubernetes</a><a href="/about.html">소개</a></nav></div></header>
<main class="wrap">
  <section class="hero"><span class="badge">Monitoring</span><h1>서비스 상태 확인</h1><p>아래 버튼으로 백엔드와 API 통신 상태를 확인할 수 있습니다.</p></section>
  <section class="cards">
    <div class="card">
      <h2>⚡ FastAPI</h2>
      <p id="health-result">확인 전</p>
      <button onclick="checkHealth()">Health Check</button>
    </div>
    <div class="card">
      <h2>🔌 API</h2>
      <p id="api-result">확인 전</p>
      <button onclick="checkAPI()">API Test</button>
    </div>
  </section>
</main>

<script>
async function load(url, target) {
  const el = document.getElementById(target);
  el.textContent = "확인 중...";
  try {
    const res = await fetch(url);
    const data = await res.json();
    el.textContent = JSON.stringify(data);
  } catch (e) {
    el.textContent = "오류: " + e;
  }
}
function checkHealth(){ load("/health", "health-result"); }
function checkAPI(){ load("/api/message", "api-result"); }
</script>
</body>
</html>
