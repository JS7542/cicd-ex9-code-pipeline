server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location /static/ {
        try_files $uri =404;
    }

    # FastAPI + Jinja2가 렌더링하는 페이지
    location /kubernetes {
        proxy_pass http://my-service-be:8000/kubernetes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://my-service-be:8000/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://my-service-be:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
